<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none">
  <!-- CIIN Emblem -->
  <g transform="translate(14, 10)">
    <defs>
      <linearGradient id="ciinGold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#D4AF37"/>
        <stop offset="100%" stop-color="#9A7B1C"/>
      </linearGradient>
    </defs>
    <!-- Interlocking Diamond Monogram -->
    <rect x="18" y="4" width="34" height="34" rx="6" transform="rotate(45 18 4)" fill="#0B2545"/>
    <rect x="22" y="8" width="26" height="26" rx="4" transform="rotate(45 22 8)" fill="none" stroke="url(#ciinGold)" stroke-width="2"/>
    <text x="31" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" text-anchor="middle">C</text>
  </g>
  <!-- Typography -->
  <text x="76" y="34" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="19" fill="#0B2545" letter-spacing="0.06em">CIIN</text>
  <text x="76" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" fill="#D4AF37" letter-spacing="0.04em">CHUXTER INVESTMENT INT'L</text>
  <text x="76" y="59" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="8.5" fill="#6B7075" letter-spacing="0.06em">NIGERIA LIMITED</text>
</svg>
