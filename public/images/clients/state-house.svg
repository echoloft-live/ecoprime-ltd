<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none">
  <!-- State House Nigeria Emblem -->
  <g transform="translate(10, 8)">
    <!-- Base Shield -->
    <path d="M32 8 C18 8 16 20 16 36 C16 52 28 62 32 64 C36 62 48 52 48 36 C48 20 46 8 32 8 Z" fill="#111827" stroke="#008751" stroke-width="2"/>
    <!-- Silver Y pall (Niger and Benue) -->
    <path d="M22 14 L32 30 L42 14 M32 30 L32 58" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Red Eagle on Top -->
    <path d="M32 2 L35 7 L39 6 L36 10 L41 12 L34 14 L32 12 L30 14 L23 12 L28 10 L25 6 L29 7 Z" fill="#DC2626"/>
    <!-- Supporting Horses (heraldic silhouettes) -->
    <!-- Left Horse -->
    <path d="M14 26 C12 22 8 20 6 24 C4 28 8 34 10 38 C12 42 10 50 8 56 L15 56 C16 50 15 42 14 36 C15 32 16 28 14 26 Z" fill="#008751"/>
    <!-- Right Horse -->
    <path d="M50 26 C52 22 56 20 58 24 C60 28 56 34 54 38 C52 42 54 50 56 56 L49 56 C48 50 49 42 50 36 C49 32 48 28 50 26 Z" fill="#008751"/>
    <!-- Base Ribbon -->
    <path d="M8 58 Q32 66 56 58 L58 63 Q32 71 6 63 Z" fill="#008751"/>
  </g>
  <!-- Text branding -->
  <text x="80" y="36" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#0B2545" letter-spacing="0.04em">STATE HOUSE</text>
  <text x="80" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10.5" fill="#008751" letter-spacing="0.08em">FEDERAL REPUBLIC OF NIGERIA</text>
</svg>
